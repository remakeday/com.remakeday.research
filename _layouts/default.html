<!doctype html>
<html lang="{{ site.lang }}">
<head>{% include head.html %}</head>
<body>
<div class="shell">
  {% include sidebar.html %}
  <div class="main">
    <div class="topbar">
      <button class="menu-btn" data-menu-toggle aria-label="메뉴 열기">☰</button>
      <span class="topbar__title">{{ page.short_title | default: page.title | default: "REMAKE DAY Research" }}</span>
      <span class="topbar__spacer"></span>
      {% if page.status %}<span class="pill pill--accent">{{ page.status }}</span>{% endif %}
    </div>
    {{ content }}
    {% include footer.html %}
  </div>
</div>
<script src="{{ '/assets/js/app.js' | relative_url }}"></script>
</body>
</html>
