<aside class="reading-rail" aria-label="연구 탐색">
  <div class="reading-rail__inner">
    <div class="rail-label">RESEARCH INDEX <span aria-hidden="true">↙</span></div>
    <nav class="research-index" aria-label="전체 연구 목차">
      {% for group in site.data.nav %}<div class="nav-group"><p class="nav-group-label">{{ group.section }}</p>
        {% for item in group.items %}<a href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}><span class="nav-number">{{ item.icon }}</span><span>{{ item.title }}</span>{% if page.url == item.url %}<span class="nav-current" aria-hidden="true">●</span>{% endif %}</a>{% endfor %}
      </div>{% endfor %}
    </nav>
    <div class="page-outline" data-outline hidden><p class="rail-label">이 페이지에서</p><nav aria-label="이 페이지 목차" data-outline-links></nav></div>
    <a class="rail-glossary" href="#reading-glossary">용어를 쉽게 읽기 <span aria-hidden="true">↗</span></a>
    <p class="rail-principle">측정하지 않은 것은<br>주장하지 않는다.</p>
  </div>
</aside>
