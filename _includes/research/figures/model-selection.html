{% assign model = site.data.research_figures.model_selection %}
{% assign embedding = model.embedding %}
<figure class="research-figure" aria-labelledby="model-funnel-title">
  <p class="figure-eyebrow">FIGURE 03A · MODEL GATE</p>
  <h3 class="figure-title" id="model-funnel-title">후보를 실제 게임 실행까지 확인하는 {{ model.stages.size }}단계</h3>
  <ol class="flow-steps" aria-label="모델 선정의 {{ model.stages.size }}단계">
    {% for stage in model.stages %}
    <li><small>STAGE {{ stage.number }}</small><strong>{{ stage.label }}</strong>{% unless forloop.last %}<span class="flow-arrow" aria-hidden="true">→</span>{% endunless %}</li>
    {% endfor %}
  </ol>
  <p class="figure-caution">이 흐름은 절차를 보여 줍니다. 단계별 후보 수는 공개 원문에 단일 확정값이 없어 그림에 넣지 않았습니다.</p>
  <p class="figure-source"><a href="{{ '/experiments/model-selection/' | relative_url }}#{{ model.stages_source_anchor }}">출처: Exp 1 · §4.1 Funnel</a></p>
  <figcaption><strong>그림 3A.</strong> 응답 형식부터 역할별 평가, 메모리 조건, 실제 게임 실행까지 순서대로 확인한 뒤 모델을 채택합니다.</figcaption>
</figure>

<figure class="research-figure" aria-labelledby="embedding-title">
  <p class="figure-eyebrow">FIGURE 03B · {{ embedding.measured_on }} 측정</p>
  <h3 class="figure-title" id="embedding-title">검수한 {{ embedding.reviewed_items }}문장에서 첫 추천 적중과 계산 시간</h3>
  <p>직접 쓴 규칙을 적용할 수 없을 때, 뜻이 가까운 대안 규칙을 먼저 보여 주는 보조 기능을 비교했습니다.</p>
  <div class="metric-comparison" role="group" aria-label="대안 정렬 방식별 첫 추천 적중 수와 가운데 응답 시간">
    {% for condition in embedding.conditions %}
    <div class="metric-row">
      <strong>{{ condition.label }}</strong>
      <small>{% if condition.dimensions %}벡터 {{ condition.dimensions }}차원{% else %}단어 형태를 비교하는 기준선{% endif %}</small>
      <span class="metric-bar"><meter min="0" max="{{ embedding.reviewed_items }}" value="{{ condition.top1_correct }}" aria-label="{{ condition.label }}{% if condition.dimensions %} 벡터 {{ condition.dimensions }}차원{% endif %}: 첫 추천 적중 {{ condition.top1_correct }}/{{ embedding.reviewed_items }}">{{ condition.top1_correct }}/{{ embedding.reviewed_items }}</meter> <b>{{ condition.top1_correct }}/{{ embedding.reviewed_items }}</b></span>
      <span class="metric-latency">가운데 응답 시간(p50) {{ condition.latency_p50_ms | round }}ms</span>
    </div>
    {% endfor %}
  </div>
  <p class="figure-legend"><span><i style="background:#647c58"></i>막대: 첫 번째로 보여 준 대안이 맞은 문장 수</span><span>p50: 측정값을 빠른 순서로 놓았을 때 가운데 시간</span><span>ms: 1,000분의 1초</span></p>
  <p>모델 이름 옆 차원은 문장을 숫자로 표현하는 벡터의 길이이며 점수가 아닙니다. 시간은 {{ embedding.latency_context }}입니다.</p>
  <p class="figure-caution">Scenario Director가 검수한 {{ embedding.reviewed_items }}문장 결과만 표시했습니다. 앞선 미검수 {{ embedding.repeat_check.items }}문장 수치는 포함하지 않았습니다. 어간 겹침은 모델을 호출하지 않는 기준선이어서 시간이 0ms로 기록됐습니다.</p>
  <p class="figure-source"><a href="{{ '/experiments/model-selection/' | relative_url }}#{{ embedding.source_anchor }}">출처: Exp 1 · {{ embedding.source_section }} 정본 수치</a></p>
  <figcaption><strong>그림 3B · {{ embedding.measured_on }}.</strong> 첫 추천 적중(top-1)은 처음 보여 준 대안이 검수 정답과 맞은 문장 수입니다. 이 그림은 검수한 {{ embedding.reviewed_items }}문장 표의 공개값을 그대로 보여 줍니다. 같은 절의 반복 n={{ embedding.repeat_check.repetitions }} 검사는 별도의 초기 {{ embedding.repeat_check.items }}문장 미검수 골든에 대한 결과이며 이 표의 반복 근거가 아닙니다. 계산 시간은 적중 수와 별도 축으로 읽습니다.</figcaption>
</figure>
